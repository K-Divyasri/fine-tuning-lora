[project]
name = "finetune-lab"
version = "0.1.0"
description = "Fine-tuning and LoRA, built from scratch in numpy -- and measured against RAG and prompting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "streamlit>=1.30",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
finetune-lab = "finetune_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["finetune_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
