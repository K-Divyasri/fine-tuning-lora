# GitHub Actions workflow for the Fine-Tuning / LoRA project.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and your dependencies, and runs the tests.
# Pass -> green checkmark on the commit. Fail -> a red X and a log to read.
# It's free on public repos.
#
# Why it's safe to run in the cloud, keyless, and with no GPU runner: all 27 tests
# train and evaluate small numpy networks entirely on CPU -- there is no LLM call,
# no API key, and no download of any real model. The "real" GPU fine-tune lives in
# real_finetune/ and is explicitly a Colab-only reference, never run here.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your
# repo (the repo root is the whole 19-fine-tuning-lora/ folder, the one that contains
# app.py, finetune_lab/, and hosting/). GitHub only runs workflow files that live under
# .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box --
    # no GPU, because nothing here needs one.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster. Point the cache
          # at the requirements file, which lives at the repo root.
          cache: pip
          cache-dependency-path: requirements.txt

      # Step 3: install the project's dependencies. The requirements file is at the
      # repo root. ("--upgrade pip" just makes sure pip itself is current first.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: run the tests. pyproject.toml at the repo root sets
      # testpaths = ["tests"], so a bare "pytest" run from the repo root finds and runs
      # the whole suite.
      # No data-generation step is needed -- the 27 tests build whatever small
      # dataset/network they need in memory. The job passes only if every test passes.
      - name: Run tests
        run: pytest
